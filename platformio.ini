; PlatformIO (VS Code). Para Arduino IDE, abra esp32_tft_touch_demo/esp32_tft_touch_demo.ino
[platformio]
src_dir = esp32_tft_touch_demo

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
build_flags = -O2
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
